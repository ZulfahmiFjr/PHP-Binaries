name: Build Android AtlasBoard Static

on:
  push:
    branches:
      - atlas-board

  workflow_dispatch:

concurrency:
  group: android-atlas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:
  android-atlas:
    name: Android ARM64 PHP 8.2 + AtlasRenderer + NauticRenderer
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make autoconf automake \
            libtool libtool-bin \
            m4 wget libc-bin \
            gzip bzip2 bison \
            g++ git re2c \
            pkg-config \
            ca-certificates \
            python3 qemu-user

      - name: Cache PHP downloads
        uses: actions/cache@v5
        with:
          path: ./download_cache
          key: php-build-download-cache-${{ hashFiles('./compile.sh') }}
          restore-keys: |
            php-build-download-cache-

      - name: Cache musl compiler
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build ARM64 musl compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          echo "GNU_SITE = https://mirrors.kernel.org/gnu" >> config.mak
          echo "DL_CMD = wget -c --timeout=30 --tries=5 --retry-connrefused --retry-on-http-error=502,503,504 -O" >> config.mak

          make -j$(nproc)
          make install

          mv ./output "${{ github.workspace }}/compiler"

      - name: Save built musl compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Compile PHP Android ARM64
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"

          set -x

          if ! ./compile.sh \
            -t android-aarch64 \
            -x \
            -j 4 \
            -g \
            -P 5 \
            -c ./download_cache \
            -D \
            -z 8.2
          then
            echo "===== LAST 250 LINES OF install.log ====="
            tail -n 250 install.log || true
            exit 1
          fi

      - name: Verify NauticRenderer is linked
        run: |
          test -x ./bin/php7/bin/php

          strings ./bin/php7/bin/php > binary-symbols.txt
          grep -q "nauticrenderer" binary-symbols.txt
          grep -q "nautic_render_map" binary-symbols.txt

          grep -q "atlasrenderer" binary-symbols.txt
          grep -q "atlas_render" binary-symbols.txt
          echo "Both renderers linked."

      - name: Run renderer smoke tests on ARM64 via QEMU
        run: |
          qemu-aarch64 ./bin/php7/bin/php -n -r 'if(!extension_loaded("atlasrenderer") || !extension_loaded("nauticrenderer")){exit(1);} echo "Both native extensions loaded\\n";'
          qemu-aarch64 ./bin/php7/bin/php -n extensions/atlasrenderer/tests/smoke.php
          qemu-aarch64 ./bin/php7/bin/php -n extensions/atlasrenderer/tests/nautic-regression.php

      - name: Inspect PHP binary
        run: |
          file ./bin/php7/bin/php
          strings ./bin/php7/bin/php \
            | grep -E 'nauticrenderer|nautic_render_map|NAUTIC_RENDERER' \
            | head -80 \
            || true

      - name: Create PHP archive
        run: |
          tar -czf \
            PHP-8.2-Android-arm64-PM5-AtlasBoardStatic.tar.gz \
            bin

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: PHP-8.2-Android-arm64-PM5-AtlasBoardStatic
          path: |
            PHP-8.2-Android-arm64-PM5-AtlasBoardStatic.tar.gz
            install.log
            compile.sh
            extensions/nauticrenderer
            extensions/atlasrenderer
          if-no-files-found: warn
