name: Build Android FFI Test

on:
  push:
    branches:
      - android-ffi-test

  workflow_dispatch:

permissions:
  contents: read

env:
  MUSL_CROSS_MAKE_VERSION: 43fcb1e63786b96add78f89d7454709ae0159fa0

jobs:
  android-ffi:
    name: Android ARM64 PHP 8.2 + FFI
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make autoconf automake libtool libtool-bin m4 wget \
            libc-bin gzip bzip2 bison g++ git re2c \
            pkg-config ca-certificates python3

      - name: Cache PHP downloads
        uses: actions/cache@v5
        with:
          path: ./download_cache
          key: php-build-download-cache-${{ hashFiles('./compile.sh') }}
          restore-keys: |
            php-build-download-cache-

      - name: Cache musl cross compiler
        id: compiler-cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/compiler
          key: musl-cross-make-${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Checkout musl-cross-make
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: pmmp/musl-cross-make
          path: musl-cross-make
          ref: ${{ env.MUSL_CROSS_MAKE_VERSION }}

      - name: Build ARM64 musl compiler
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        working-directory: musl-cross-make
        run: |
          echo "TARGET = aarch64-linux-musl" > config.mak
          echo "GNU_SITE = https://mirrors.kernel.org/gnu" >> config.mak
          echo "DL_CMD = wget -c --timeout=30 --tries=5 --retry-connrefused --retry-on-http-error=502,503,504 -O" >> config.mak

          make -j$(nproc)
          make install

          mv ./output "${{ github.workspace }}/compiler"

      - name: Build libffi for Android ARM64 target
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"

          git clone \
            --depth 1 \
            --branch v3.8.0 \
            https://github.com/libffi/libffi.git \
            libffi-src

          cd libffi-src

          ./autogen.sh

          PREFIX="${{ github.workspace }}/libffi-aarch64"

          CC=aarch64-linux-musl-gcc \
          CXX=aarch64-linux-musl-g++ \
          AR=aarch64-linux-musl-ar \
          RANLIB=aarch64-linux-musl-ranlib \
          ./configure \
            --host=aarch64-linux-musl \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j$(nproc)
          make install

          echo "libffi install:"
          find "$PREFIX" -maxdepth 4 -type f | sort

          PC_FILE="$(find "$PREFIX" -name libffi.pc -print -quit)"

          if [ -z "$PC_FILE" ]; then
            echo "libffi.pc not found"
            exit 1
          fi

          PC_DIR="$(dirname "$PC_FILE")"

          echo "FFI_CFLAGS=-I$PREFIX/include" >> "$GITHUB_ENV"
          echo "FFI_LIBS=-L$PREFIX/lib -lffi" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$PC_DIR" >> "$GITHUB_ENV"

      - name: Enable FFI in PHP build
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("compile.sh")
          s = p.read_text()

          if "--with-ffi \\" not in s:
              needle = "--with-gmp \\\n"

              if needle not in s:
                  raise SystemExit("Could not find insertion point in compile.sh")

              s = s.replace(
                  needle,
                  needle + "--with-ffi \\\n",
                  1
              )

              p.write_text(s)

          print("FFI configure flag:")
          for i, line in enumerate(p.read_text().splitlines(), 1):
              if "with-ffi" in line:
                  print(f"{i}: {line}")
          PY

      - name: Compile PHP 8.2 Android ARM64 with FFI
        run: |
          export PATH="${{ github.workspace }}/compiler/bin:$PATH"

          set -ex

          ./compile.sh \
            -t android-aarch64 \
            -x \
            -j 4 \
            -g \
            -P 5 \
            -c ./download_cache \
            -D \
            -z 8.2

      - name: Inspect build
        run: |
          echo "PHP binary:"
          file ./bin/php7/bin/php

          echo ""
          echo "Looking for FFI symbols:"
          strings ./bin/php7/bin/php | grep -i "FFI" | head -50 || true

          echo ""
          echo "PHP files:"
          find ./bin/php7 -maxdepth 3 -type f | sort | head -100

      - name: Create PHP archive
        run: |
          tar -czf \
            PHP-8.2-Android-arm64-PM5-FFI-test.tar.gz \
            bin

      - name: Upload PHP artifact
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: PHP-8.2-Android-arm64-PM5-FFI-test
          path: |
            PHP-8.2-Android-arm64-PM5-FFI-test.tar.gz
            install.log
            compile.sh
          if-no-files-found: warn
